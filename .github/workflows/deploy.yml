name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://tomnaiser.github.io
      BASE_PATH: /
      PUBLIC_SITE_LIVE: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Install, build, check and upload
        uses: withastro/action@v6
        with:
          node-version: '24.19.0'
          build-cmd: pnpm run build:pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
